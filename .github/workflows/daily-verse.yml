name: Daily Verse

on:
  schedule:
    - cron: '0 * * * *'   # every hour, script decides whether to act
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Maybe fetch and append a verse
        run: python scripts/update_verse.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSE.md
          git diff --cached --quiet && echo "No changes this run" || (git commit -m "Daily verse update" && git push)